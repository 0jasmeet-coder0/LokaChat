<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LokaChat">
<meta name="description" content="LokaChat - videos, reels, stories and private chat.">
<title>LokaChat</title>
<!-- Favicon: inline sky-blue/white droplet-chat icon (no /favicon.ico request, so no 404) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M32 7C32 7 14 28 14 40a18 18 0 0 0 36 0C50 28 32 7 32 7z' fill='%2338BDF8'/%3E%3Cpath d='M23 38h18M23 45h11' stroke='%23fff' stroke-width='3.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ SVG icon sprite (stroke icons, use with <svg class="ic"><use href="#i-name"/></svg>) ============ -->

    <symbol id="i-pip" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1"/></symbol>

    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M20 12H9a5 5 0 0 0-5 5v1"/></symbol>
    <symbol id="i-gif" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10H8.5a1.5 1.5 0 0 0 0 4H10v-1.5H9M13 10v4M15.5 14v-4H18"/></symbol>
    <symbol id="i-translate" viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 5c0 4 2.5 7 6 8M12 5c0 3-2.5 6.500-7 8M13 21l4-10 4 10M14.500 18h5"/></symbol>

<!-- ============ Splash: falling droplet -> ripples -> wordmark ============ -->
<div id="splash" aria-hidden="true">
  <div class="sp-drop"></div>
  <div class="sp-ripple r1"></div>
  <div class="sp-ripple r2"></div>
  <div class="sp-brand">
    <div class="wordmark xl"><span class="w1">Loka</span><span class="w2">Chat</span></div>
    <div class="sp-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<!-- ============ Setup screen (shown only until config.js is filled in) ============ -->
<section id="setup" class="screen" hidden>
  <div class="auth-card">
    <div class="wordmark xl"><span class="w1">Loka</span><span class="w2">Chat</span></div>
    <h2>Finish setup</h2>
    <p class="muted">Open <code>frontend/config.js</code> and paste your <b>Supabase URL</b> and <b>Supabase anon key</b> (and set <b>API_URL</b>), then reload this page.</p>
    <ul class="setup-list" id="setup-missing"></ul>
  </div>
</section>

<!-- ============ Sign in / Create account gate ============ -->
<section id="auth" class="screen" hidden>
  <div class="auth-card">
    <div class="wordmark xl"><span class="w1">Loka</span><span class="w2">Chat</span></div>
    <p class="muted auth-tag">Videos, stories, clips and private chat.</p>
    <div id="auth-body"></div>
  </div>
</section>

<!-- ============ App shell ============ -->
<div id="app" hidden>
  <header id="topbar">
    <div class="tb-left">
      <a class="wordmark" href="#/home" aria-label="LokaChat home"><span class="w1">Loka</span><span class="w2">Chat</span></a>
      <b class="tb-page" id="tb-page" aria-live="polite"></b>
      <button class="icon-btn" id="rail-toggle" data-action="toggle-pin" aria-label="Pin or collapse sidebar"></button>
    </div>
    <div class="tb-right">
      <!-- v7: Instagram-style account switcher trigger (filled in by auth.js) -->
      <button class="acct-trigger" id="acct-trigger" data-action="open-switcher" aria-haspopup="dialog" aria-label="Switch account" hidden><span class="at">@</span><span id="acct-name"></span><svg class="ic"><use href="#i-chevron-down"/></svg></button>
      <div class="menu-root" data-menu-root>
        <button class="btn sm create-btn" data-action="toggle-menu" data-target="create-menu">+ <span>Create</span></button>
        <div class="menu" id="create-menu">
          <button data-action="create-type" data-type="video"><svg class="ic"><use href="#i-clips"/></svg>Upload video</button>
          <button data-action="create-type" data-type="post"><svg class="ic"><use href="#i-image"/></svg>Create post</button>
          <button data-action="create-type" data-type="story"><svg class="ic"><use href="#i-clock"/></svg>Create story</button>
          <button data-action="note-menu"><svg class="ic"><use href="#i-music"/></svg>Note</button>
        </div>
      </div>
      <button class="icon-btn notif-btn" data-action="open-notifs" aria-label="Notifications"><svg class="ic"><use href="#i-heart"/></svg><b class="dot" id="notif-dot" hidden></b></button>
    </div>
  </header>

  <aside id="rail" aria-label="Main navigation">
    <nav class="rail-nav">
      <a class="rail-item" data-route="home" href="#/home"><svg class="ic"><use href="#i-home"/></svg><span class="lbl">Home</span></a>
      <a class="rail-item" data-route="reels" href="#/reels"><svg class="ic"><use href="#i-clips"/></svg><span class="lbl">Reels</span></a>
      <a class="rail-item" data-route="messages" href="#/messages"><svg class="ic"><use href="#i-send"/></svg><span class="lbl">Messages</span><b class="badge" id="badge-msg" hidden></b></a>
      <a class="rail-item" data-route="search" href="#/search"><svg class="ic"><use href="#i-search"/></svg><span class="lbl">Search</span></a>
      <button class="rail-item" data-action="open-notifs"><svg class="ic"><use href="#i-heart"/></svg><span class="lbl">Notifications</span><b class="badge" id="notif-dot-r" hidden></b></button>
      <a class="rail-item" data-route="post" href="#/post"><svg class="ic"><use href="#i-plus"/></svg><span class="lbl">Create</span></a>
      <a class="rail-item" data-route="you" href="#/you"><span class="rail-avatar" id="rail-avatar"></span><span class="lbl">Profile</span></a>
      <div class="rail-bottom" data-menu-root>
        <button class="rail-item" data-action="open-settings"><svg class="ic"><use href="#i-gear"/></svg><span class="lbl">Settings</span></button>
        <button class="rail-item" data-action="toggle-menu" data-target="more-menu"><svg class="ic"><use href="#i-menu"/></svg><span class="lbl">More</span></button>
      </div>
    </nav>
  </aside>
  <div class="rail-space"></div>
  <div class="menu more-menu" id="more-menu" data-menu-root>
    <button data-action="more-saved"><svg class="ic"><use href="#i-bookmark"/></svg>Saved</button>
    <button data-action="more-history"><svg class="ic"><use href="#i-clock"/></svg>Watch history</button>
    <button data-action="more-vault"><svg class="ic"><use href="#i-shield"/></svg>Security &amp; 2FA vault</button>
    <button data-action="open-switcher"><svg class="ic"><use href="#i-users"/></svg>Switch account</button>
    <button data-action="logout" class="danger-t"><svg class="ic"><use href="#i-logout"/></svg>Log out</button>
  </div>

  <div id="main"><main id="view" tabindex="-1"></main></div>

  <nav id="bottomnav" aria-label="Primary">
    <a data-route="home" href="#/home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></a>
    <a data-route="search" href="#/search"><svg class="ic"><use href="#i-search"/></svg><span>Search</span></a>
    <a data-route="messages" href="#/messages"><svg class="ic"><use href="#i-send"/></svg><span>Chats</span><b class="badge" id="badge-msg-m" hidden></b></a>
    <a data-route="you" href="#/you"><svg class="ic"><use href="#i-user"/></svg><span>You</span></a>
  </nav>

  <!-- Floating Messages pill (desktop >= 768px), like Instagram web -->
  <div id="msg-pill-wrap">
    <div class="pill-pop" id="pill-pop"></div>
    <button class="msg-pill" data-action="pill-toggle" aria-label="Open messages"><svg class="ic"><use href="#i-send"/></svg><span>Messages</span><b class="pill-badge" id="pill-badge" hidden></b><span class="pill-avs" id="pill-avs"></span></button>
  </div>
</div>

<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="crypto.js"></script>
<script src="api.js"></script>
<script src="core.js"></script>
<script src="views.js"></script>
<script src="watch.js"></script>
<script src="chat.js"></script>
<script src="you.js"></script>
<script src="v6.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
