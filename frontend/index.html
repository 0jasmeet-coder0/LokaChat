<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>LokaChat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ SVG icon sprite (stroke icons, use with <svg class="ic"><use href="#i-name"/></svg>) ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-clips" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m10 8.5 5.5 3.5-5.5 3.5z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="m15 3 6 6-3 1-3.5 3.5.5 4-1.5 1.5-4-4-5 5M9 4l-1 3-3 3 9 9 3-3 3-1"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a7 7 0 0 1 4 5.5"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M5 9h15M4 15h15M10 3 8 21M16 3l-2 18"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
    <symbol id="i-comment" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6M22 9l-5 6"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-reply" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 6 6v1"/></symbol>
    <symbol id="i-pip" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-thumbdown" viewBox="0 0 24 24"><path d="M17 14V3H7l-3 8v3h6l-1 6 7-8zM17 3h4v10h-4"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
  </defs>
</svg>

<!-- ============ Splash: falling droplet -> ripples -> wordmark ============ -->
<div id="splash" aria-hidden="true">
  <div class="sp-drop"></div>
  <div class="sp-ripple r1"></div>
  <div class="sp-ripple r2"></div>
  <div class="sp-brand">
    <div class="wordmark xl"><span class="w1">Loka</span><span class="w2">Chat</span></div>
    <div class="sp-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<!-- ============ Setup screen (shown only until config.js is filled in) ============ -->
<section id="setup" class="screen" hidden>
  <div class="auth-card">
    <div class="wordmark xl"><span class="w1">Loka</span><span class="w2">Chat</span></div>
    <h2>Finish setup</h2>
    <p class="muted">Open <code>frontend/config.js</code> and paste your <b>Supabase URL</b> and <b>Supabase anon key</b> (and set <b>API_URL</b>), then reload this page.</p>
    <ul class="setup-list" id="setup-missing"></ul>
  </div>
</section>

<!-- ============ Sign in / Create account gate ============ -->
<section id="auth" class="screen" hidden>
  <div class="auth-card">
    <div class="wordmark xl"><span class="w1">Loka</span><span class="w2">Chat</span></div>
    <p class="muted auth-tag">Videos, stories, clips and private chat.</p>
    <div id="auth-body"></div>
  </div>
</section>

<!-- ============ App shell ============ -->
<div id="app" hidden>
  <header id="topbar">
    <div class="tb-left">
      <button class="icon-btn" id="rail-toggle" data-action="toggle-pin" aria-label="Toggle sidebar"></button>
      <a class="wordmark" href="#/home" aria-label="LokaChat home"><span class="w1">Loka</span><span class="w2">Chat</span></a>
    </div>
    <div class="tb-right">
      <div class="menu-root" data-menu-root>
        <button class="btn sm create-btn" data-action="toggle-menu" data-target="create-menu">+ <span>Create</span></button>
        <div class="menu" id="create-menu">
          <button data-action="create-type" data-type="video">Video</button>
          <button data-action="create-type" data-type="clip">Reel</button>
          <button data-action="create-type" data-type="photo">Photo</button>
          <button data-action="create-type" data-type="story">Story</button>
          <button data-action="create-type" data-type="community">Community post</button>
          <button data-action="note-menu">Note</button>
        </div>
      </div>
      <button class="icon-btn notif-btn" data-action="open-notifs" aria-label="Notifications"><svg class="ic"><use href="#i-heart"/></svg><b class="dot" id="notif-dot" hidden></b></button>
    </div>
  </header>

  <aside id="rail" aria-label="Main navigation">
    <nav class="rail-nav">
      <a class="rail-item" data-route="home" href="#/home"><svg class="ic"><use href="#i-home"/></svg><span class="lbl">Home</span></a>
      <a class="rail-item" data-route="reels" href="#/reels"><svg class="ic"><use href="#i-clips"/></svg><span class="lbl">Reels</span></a>
      <a class="rail-item" data-route="messages" href="#/messages"><svg class="ic"><use href="#i-send"/></svg><span class="lbl">Messages</span><b class="badge" id="badge-msg" hidden></b></a>
      <a class="rail-item" data-route="search" href="#/search"><svg class="ic"><use href="#i-search"/></svg><span class="lbl">Search</span></a>
      <a class="rail-item" data-route="post" href="#/post"><svg class="ic"><use href="#i-plus"/></svg><span class="lbl">Create</span></a>
      <a class="rail-item" data-route="you" href="#/you"><span class="rail-avatar" id="rail-avatar"></span><span class="lbl">You</span></a>
    </nav>
  </aside>
  <div class="rail-space"></div>

  <div id="main"><main id="view" tabindex="-1"></main></div>

  <nav id="bottomnav" aria-label="Primary">
    <a data-route="home" href="#/home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></a>
    <a data-route="reels" href="#/reels"><svg class="ic"><use href="#i-clips"/></svg><span>Reels</span></a>
    <a data-route="post" href="#/post"><svg class="ic"><use href="#i-plus"/></svg><span>Post</span></a>
    <a data-route="messages" href="#/messages"><svg class="ic"><use href="#i-send"/></svg><span>Chats</span><b class="badge" id="badge-msg-m" hidden></b></a>
    <a data-route="you" href="#/you"><svg class="ic"><use href="#i-user"/></svg><span>You</span></a>
  </nav>

  <!-- Floating Messages pill (desktop >= 768px), like Instagram web -->
  <div id="msg-pill-wrap">
    <div class="pill-pop" id="pill-pop"></div>
    <button class="msg-pill" data-action="pill-toggle" aria-label="Open messages"><svg class="ic"><use href="#i-send"/></svg><span>Messages</span><b class="pill-badge" id="pill-badge" hidden></b><span class="pill-avs" id="pill-avs"></span></button>
  </div>
</div>

<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="crypto.js"></script>
<script src="api.js"></script>
<script src="core.js"></script>
<script src="views.js"></script>
<script src="watch.js"></script>
<script src="chat.js"></script>
<script src="you.js"></script>
<script src="app.js"></script>
</body>
</html>
